<style>
  :root {
    --navy: #14213D; --navy-2: #1F2F52; --orange: #E5743A; --orange-deep: #C65F2E; --orange-soft: #FCEBDF;
    --cream: #F6F1E7; --paper: #FFFFFF; --line: #E7E0D3; --line-2: #F0EBE1;
    --ink: #14213D; --ink-2: #4A5468; --ink-3: #8A91A0;
    --win: #2E8B57; --win-soft: #E3F3EA; --loss: #C2412D; --loss-soft: #FBE7E3; --gold: #B7861F; --gold-soft: #FBF1DC;
    --shadow: 0 1px 2px rgba(20,33,61,.06), 0 6px 20px rgba(20,33,61,.06);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--cream); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
  .disp { font-family: 'Oswald', 'Inter', sans-serif; letter-spacing: .02em; text-transform: uppercase; }

  /* ---------- header ---------- */
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--navy); color: #fff; box-shadow: 0 2px 12px rgba(20,33,61,.18); }
  .topbar-in { max-width: 980px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .topbar img { width: 42px; height: 42px; }
  .brand-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .06em; line-height: 1; }
  .brand-sub { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #F2A878; font-weight: 600; margin-top: 3px; }
  .daybar { max-width: 980px; margin: 0 auto; padding: 0 20px 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .daybar::-webkit-scrollbar { display: none; }
  .daytab { flex-shrink: 0; background: rgba(255,255,255,.08); color: #DCE1EC; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 14px; font: 600 13px 'Inter', sans-serif; cursor: pointer; transition: all .15s ease; }
  .daytab:hover { background: rgba(255,255,255,.16); color: #fff; }
  .daytab.active { background: #fff; color: var(--navy); border-color: #fff; }
  .daytab.bets { background: var(--orange); border-color: var(--orange); color: #fff; }
  .daytab.bets.active { background: #fff; color: var(--orange-deep); border-color: #fff; box-shadow: inset 0 0 0 2px var(--orange); }

  .gamebar-wrap { position: sticky; top: 104px; z-index: 40; background: rgba(246,241,231,.94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .gamebar { max-width: 980px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .gamechip { flex-shrink: 0; display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font: 600 13px 'Inter', sans-serif; color: var(--ink-2); cursor: pointer; transition: all .15s ease; }
  .gamechip:hover { border-color: var(--ink-3); color: var(--ink); }
  .gamechip.active { border-color: var(--navy); color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
  .gamechip .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .gamechip .vs { color: var(--ink-3); font-weight: 500; }
  .gamechip .star { color: var(--orange); }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }

  /* ---------- bets board ---------- */
  .board { display: none; padding-top: 24px; }
  .board.show { display: block; }
  .board-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .board-head img { width: 76px; height: 76px; }
  .board-head h1 { font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: .03em; line-height: 1.05; text-transform: uppercase; }
  .board-head .sub { color: var(--ink-2); font-size: 14px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 110px; }
  .kpi b { display: block; font-family: 'Oswald', sans-serif; font-size: 24px; line-height: 1.1; }
  .kpi span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .betcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .betcard { position: relative; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 18px 16px 22px; cursor: pointer; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; border: 1px solid var(--line-2); text-align: left; font: inherit; color: inherit; }
  .betcard:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,33,61,.08), 0 12px 28px rgba(20,33,61,.10); }
  .betcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c, var(--orange)); }
  .betcard .bc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .betcard .bc-day { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .betcard .bc-pick { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: var(--c, var(--ink)); }
  .betcard .bc-match { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .betcard .bc-nums { display: flex; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .betcard .bc-nums b { color: var(--ink); }

  /* ---------- game ---------- */
  .game { display: none; padding-top: 22px; }
  .game.active { display: block; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .eyebrow .pill { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); letter-spacing: .06em; }
  .eyebrow .pill.neutral { background: var(--orange-soft); border-color: #F4C3A3; color: var(--orange-deep); }

  .card { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line-2); margin-bottom: 16px; overflow: hidden; }
  .card-pad { padding: 20px 22px; }
  .colorbar { display: flex; height: 6px; }
  .colorbar span { flex: 1; }

  .matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 22px 22px 18px; }
  .team { min-width: 0; }
  .team.home { text-align: right; }
  .team .nm { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
  .team .meta { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .team .meta b { color: var(--ink); font-weight: 600; }
  .poll { display: inline-block; font: 700 11px 'Inter', sans-serif; padding: 2px 7px; border-radius: 6px; vertical-align: middle; margin: 0 6px; color: #fff; background: var(--navy); }
  .mid { text-align: center; }
  .mid .at { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--ink-3); font-weight: 600; }
  .neutral-tag { margin: 0 22px 16px; background: var(--orange-soft); border: 1px solid #F4C3A3; color: var(--orange-deep); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .neutral-tag .lbl { font-family: 'Oswald', sans-serif; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }

  .wp { padding: 0 22px 20px; }
  .wp-labels { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
  .wp-labels .c { color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; font-size: 11.5px; }
  .wp-bar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; background: var(--line-2); }
  .wp-bar div { display: flex; align-items: center; color: #fff; font: 700 13.5px 'Inter', sans-serif; padding: 0 10px; white-space: nowrap; min-width: 0; }
  .wp-bar .r { justify-content: flex-end; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line-2); }
  .tile { padding: 14px 18px; border-right: 1px solid var(--line-2); }
  .tile:last-child { border-right: 0; }
  .tile .k { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .tile .v { font-family: 'Oswald', sans-serif; font-size: 21px; font-weight: 600; line-height: 1.15; }
  .tile .s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .edge { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 22px; background: var(--orange-soft); border-top: 1px solid #F4C3A3; font-size: 13.5px; color: var(--ink); }
  .edge .lbl { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--orange-deep); }
  .edge.quiet { background: var(--line-2); border-top-color: var(--line); }
  .edge.quiet .lbl { color: var(--ink-3); }
  .facts { display: flex; gap: 8px 22px; flex-wrap: wrap; padding: 11px 22px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts .k { color: var(--ink-3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11.5px; margin-right: 5px; }

  /* bet */
  .bet { border: 2px solid var(--orange); }
  .bet-head { background: var(--orange); color: #fff; padding: 9px 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .bet-head .lbl { font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: .14em; font-size: 15px; }
  .bet-head .units { font-weight: 700; font-size: 13.5px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; }
  .bet-pick { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1; text-transform: uppercase; }
  .bet-detail { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .res { font: 700 12px 'Inter', sans-serif; letter-spacing: .08em; padding: 3px 10px; border-radius: 999px; }
  .res.win { background: var(--win); color: #fff; } .res.loss { background: var(--loss); color: #fff; } .res.push { background: var(--ink-3); color: #fff; }
  .reasons { margin-top: 16px; display: grid; gap: 8px; }
  .reason { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--ink); background: var(--line-2); border-radius: 10px; padding: 10px 12px; }
  .reason .chip { flex-shrink: 0; font: 700 11px 'Inter', sans-serif; letter-spacing: .1em; padding: 3px 8px; border-radius: 6px; margin-top: 1px; }
  .reason.signal .chip { background: var(--win-soft); color: var(--win); }
  .reason.caution .chip { background: var(--gold-soft); color: var(--gold); }
  .nobet { border: 1px dashed var(--line); background: transparent; box-shadow: none; color: var(--ink-3); font-size: 14px; padding: 14px 22px; font-weight: 500; }

  /* sections */
  .sec { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sec small { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; }

  /* head to head stat rows */
  .h2h-head { display: grid; grid-template-columns: 1fr 150px 1fr; padding: 12px 22px 6px; font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .h2h-head .r { text-align: right; }
  .h2h-head .c { text-align: center; color: var(--ink-3); font-size: 12px; }
  .srow { display: grid; grid-template-columns: 1fr 150px 1fr; align-items: center; gap: 10px; padding: 8px 22px; border-top: 1px solid var(--line-2); }
  .srow .cat { text-align: center; font-size: 12.5px; color: var(--ink-2); font-weight: 600; line-height: 1.25; }
  .side { display: flex; align-items: center; gap: 8px; }
  .side.l { flex-direction: row-reverse; }
  .side .val { font-weight: 700; font-size: 14px; min-width: 52px; }
  .side.l .val { text-align: right; } .side.r .val { text-align: left; }
  .side .rk { font-size: 11px; color: var(--ink-3); font-weight: 600; min-width: 34px; }
  .side.l .rk { text-align: right; }
  .track { flex: 1; height: 10px; background: var(--line-2); border-radius: 999px; overflow: hidden; display: flex; }
  .side.l .track { justify-content: flex-end; }
  .track i { display: block; height: 100%; border-radius: 999px; }
  .tally { padding: 10px 22px 14px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  /* compare tiles */


  .stylecard { padding: 6px 0; }
  .xrow { display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line-2); }
  .xrow:last-child { border-bottom: 0; }
  .xrow .sl { text-align: center; font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .xrow .sv { font-family: 'Oswald', sans-serif; font-size: 19px; font-weight: 500; color: var(--ink-2, #5B6478); }
  .xrow .sv.lead { font-weight: 700; }
  .xrow .r { text-align: right; }
  .xrow.shead { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  @media (max-width: 640px) { .xrow .sl { font-size: 13px; } .xrow .sv { font-size: 20px; } }
  .ptab { padding: 0; overflow: hidden; margin-bottom: 12px; }
  .pt-head { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; padding: 12px 16px 10px; border-bottom: 3px solid; }
  .pt-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ptab table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
  .ptab th { text-align: right; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-transform: uppercase; }
  .ptab th:first-child, .ptab td.pn { text-align: left; }
  .ptab td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
  .ptab td.pn b { display: block; font-size: 14px; }
  .ptab td.pn span { font-size: 12px; color: var(--ink-3); }
  .ptab tr:last-child td { border-bottom: 0; }
  .pt-foot { font-size: 11px; color: var(--ink-3); padding: 8px 16px 10px; border-top: 1px solid var(--line-2); }
  @media (max-width: 640px) { .ptab table { font-size: 15px; } .ptab td.pn b { font-size: 15px; } }
  .cmp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cmp { background: var(--paper); border-radius: 12px; border: 1px solid var(--line-2); box-shadow: var(--shadow); padding: 14px 16px; }
  .cmp .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .cmp .pair { display: flex; justify-content: space-between; align-items: baseline; }
  .cmp .pair .v { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 22px; }
  .cmp .pair .v.dim { opacity: .45; }
  .cmp .who { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
  .cmp .split { display: flex; height: 6px; border-radius: 999px; overflow: hidden; margin-top: 8px; background: var(--line-2); gap: 2px; }

  /* books */
  .books { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .books th { text-align: right; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .books th:first-child, .books td:first-child { text-align: left; }
  .books td { text-align: right; padding: 9px 14px; border-bottom: 1px solid var(--line-2); color: var(--ink-2); font-weight: 500; }
  .books td:first-child { color: var(--ink); font-weight: 600; }
  .books td.best { color: var(--orange-deep); font-weight: 700; }
  .books-scroll { overflow-x: auto; }
  .best-line { padding: 10px 14px; font-size: 13px; color: var(--ink-2); }
  .best-line b { color: var(--orange-deep); }

  /* notes */
  .note { background: var(--paper); border-radius: 12px; border: 1px solid var(--line-2); box-shadow: var(--shadow); padding: 12px 16px 12px 18px; margin-bottom: 10px; position: relative; overflow: hidden; }
  .note::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--navy)); }
  .note .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c, var(--navy)); margin-bottom: 4px; display: block; }
  .note p { font-size: 14.5px; color: var(--ink); }
  .list-card { padding: 6px 0; }
  .list-card div { padding: 8px 18px; font-size: 13.5px; color: var(--ink-2); border-top: 1px solid var(--line-2); }
  .list-card div:first-child { border-top: 0; }
  .list-card b { color: var(--ink); }
  .final { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 12px 22px; background: var(--navy); color: #fff; font-weight: 600; font-size: 14px; }
  .final .lbl { font-family: 'Oswald', sans-serif; letter-spacing: .14em; color: #F2A878; }

  @media (max-width: 700px) {
    body { font-size: 16px; }
    .topbar-in, .daybar, .gamebar, .wrap { padding-left: 14px; padding-right: 14px; }
    .brand-name { font-size: 24px; } .brand-sub { font-size: 13px; }
    .daytab { font-size: 15px; padding: 8px 15px; }
    .gamechip { font-size: 15px; padding: 9px 13px; }
    .eyebrow { font-size: 13.5px; }
    .team .nm { font-size: clamp(21px, 6.6vw, 28px); overflow-wrap: normal; word-break: normal; hyphens: none; }
    .matchup { grid-template-columns: 1fr 26px 1fr; }
    .team .meta { font-size: 14.5px; } .poll { display: table; margin: 0 0 5px auto; font-size: 12.5px; } .team:not(.home) .poll { margin: 0 0 5px; }
    .matchup { padding: 18px 14px 14px; gap: 8px; }
    .mid .at { font-size: 20px; }
    .wp, .card-pad { padding-left: 14px; padding-right: 14px; }
    .wp-labels { font-size: 14.5px; } .wp-labels .c { font-size: 12.5px; }
    .wp-bar { height: 34px; } .wp-bar div { font-size: 15.5px; }
    .neutral-tag { margin: 0 14px 14px; font-size: 15px; } .neutral-tag .lbl { font-size: 15px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tile { padding: 14px; } .tile:nth-child(2) { border-right: 0; } .tile:nth-child(-n+2) { border-bottom: 1px solid var(--line-2); }
    .tile .k { font-size: 12.5px; } .tile .v { font-size: 23px; } .tile .s { font-size: 14px; }
    .edge, .facts { font-size: 15px; padding-left: 14px; padding-right: 14px; } .facts .k { font-size: 12.5px; }
    .bet-head .lbl { font-size: 17px; } .bet-pick { font-size: 32px; } .bet-detail { font-size: 15.5px; }
    .reason { font-size: 16px; } .reason .chip { font-size: 12px; }
    .nobet { font-size: 15.5px; }
    .sec { font-size: 19px; } .sec small { font-size: 12.5px; }
    /* stat rows stack: category on top, both teams below */
    .h2h-head { grid-template-columns: 1fr 1fr; padding: 12px 14px 6px; font-size: 15px; } .h2h-head .c { display: none; }
    .srow { grid-template-columns: 1fr 1fr; gap: 6px 14px; padding: 10px 14px; }
    .srow .cat { grid-column: 1 / -1; order: -1; font-size: 14.5px; text-align: left; color: var(--ink); }
    .side .val { font-size: 16.5px; min-width: 52px; } .side .rk { font-size: 12.5px; min-width: 36px; }
    .side.l { flex-direction: row; } .side.l .val, .side.l .rk { text-align: left; } .side.l .track { justify-content: flex-start; }
    .tally { font-size: 15px; padding-left: 14px; padding-right: 14px; }
    .cmp-grid { grid-template-columns: 1fr; }
    .cmp .lbl { font-size: 13.5px; } .cmp .pair .v { font-size: 26px; } .cmp .who { font-size: 14px; }
    .books { font-size: 15px; } .books th { font-size: 12px; } .best-line { font-size: 15px; }
    .note .tag { font-size: 13px; } .note p { font-size: 16px; }
    .list-card div { font-size: 15px; }
    .board-head img { width: 64px; height: 64px; } .board-head h1 { font-size: 27px; } .board-head .sub { font-size: 15.5px; }
    .kpi { min-width: 0; flex: 1 1 40%; } .kpi b { font-size: 26px; } .kpi span { font-size: 12.5px; }
    .betcard .bc-day { font-size: 13px; } .betcard .bc-pick { font-size: 29px; } .betcard .bc-match, .betcard .bc-nums { font-size: 15.5px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .betcard { transition: none; } }

  /* search */
  .topbar-in { flex-wrap: wrap; }
  .search { position: relative; flex: 1 1 260px; max-width: 420px; margin-left: auto; }
  .search input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 999px; padding: 9px 38px 9px 38px; font: 500 15px 'Inter', sans-serif; outline: none; -webkit-appearance: none; transition: background .15s ease, border-color .15s ease; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .search input::placeholder { color: #AEB6C8; }
  .search input:focus { background: #fff; color: var(--ink); border-color: #fff; }
  .search input:focus::placeholder { color: var(--ink-3); }
  .search .s-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #AEB6C8; pointer-events: none; }
  .search input:focus ~ .s-ico { color: var(--ink-3); }
  .search .s-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--line-2); color: var(--ink-2); font: 700 16px/1 'Inter', sans-serif; cursor: pointer; display: none; }
  .search.has-q .s-clear { display: block; }
  .results { display: none; position: fixed; left: 0; right: 0; z-index: 60; padding: 0 12px; }
  .results.open { display: block; }
  .results-in { max-width: 980px; margin: 6px auto 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 40px rgba(20,33,61,.22); max-height: 70vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .r-head { position: sticky; top: 0; background: var(--paper); padding: 10px 16px 8px; font: 700 11px 'Inter', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line-2); }
  .r-day { padding: 10px 16px 4px; font: 700 11px 'Inter', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--orange-deep); }
  .r-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-2); padding: 11px 16px; cursor: pointer; font: 500 14px 'Inter', sans-serif; color: var(--ink); }
  .r-item:last-child { border-bottom: 0; }
  .r-item:hover, .r-item.sel { background: var(--cream); }
  .r-main { flex: 1; min-width: 0; }
  .r-teams { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .r-teams .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .r-teams .vs { color: var(--ink-3); font-weight: 600; font-size: 12px; }
  .r-meta { margin-top: 3px; font-size: 12px; color: var(--ink-3); }
  .r-meta b { color: var(--ink-2); font-weight: 600; }
  .r-side { text-align: right; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .r-side .res { margin-left: 0; }
  .r-star { color: var(--orange); }
  .r-empty { padding: 22px 16px; color: var(--ink-3); font-size: 14px; text-align: center; }
  .game.flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--orange); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (max-width: 640px) { .search { flex-basis: 100%; max-width: none; margin-left: 0; } .search input { font-size: 16px; } }
</style>
</head>

<main class="wrap">
  <section class="board" id="board"></section>
  <div id="games"></div>
</main>
<script>const N_TEAMS = 365;
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function num(v) { return v !== null && v !== undefined && v !== "" && !isNaN(Number(v)); }
function fmtVal(v, fmt) {
  if (v === null || v === undefined || v === "") return "-";
  if (fmt === "text") return String(v);
  if (fmt === "pct1") return Number(v).toFixed(1) + "%";
  if (fmt === "pct0") return (Number(v) * 100).toFixed(0) + "%";
  if (fmt === "int") return String(Math.round(Number(v)));
  if (fmt === "of5") return Math.round(Number(v)) + " of 5";
  if (fmt === "num2") return Number(v).toFixed(2);
  if (fmt === "ftin") { const n = Number(v), ft = Math.floor(n / 12), inch = n - ft * 12; return `${ft}\u2032${inch.toFixed(1)}\u2033`; }
  if (fmt === "pct_raw") return Number(v).toFixed(1) + "%";
  return Number(v).toFixed(1);
}
function sgn(v) { if (!num(v)) return "-"; const n = Number(v); return Math.abs(n) < 0.25 ? "PK" : (n > 0 ? "+" : "") + n.toFixed(1); }
function ml(v) { if (!num(v)) return "-"; const n = Math.round(Number(v)); return (n > 0 ? "+" : "") + n; }
function ord(r) { const s = (r % 10 === 1 && r % 100 !== 11) ? "st" : (r % 10 === 2 && r % 100 !== 12) ? "nd" : (r % 10 === 3 && r % 100 !== 13) ? "rd" : "th"; return r + s; }

function marketText(g) {
  const m = g.market || {};
  if (!m.has_line) return null;
  const s = Number(m.spread);
  const fav = s <= 0 ? g.home : g.away;
  return `${fav} ${Math.abs(s) < 0.25 ? "PK" : "-" + Math.abs(s).toFixed(1)}`;
}

/* one side of a matchup stat row: bar length = how high the team ranks nationally */
function side(cls, val, rank, color, lead, fmt) {
  const w = num(rank) ? Math.max(6, 100 * (1 - (Number(rank) - 1) / N_TEAMS)) : 0;
  return `<div class="side ${cls}">
      <span class="val" style="color:${color}">${fmtVal(val, fmt)}</span>
      <div class="track"><i style="width:${w}%; background:${color}; opacity:${lead ? 1 : .35}"></i></div>
      <span class="rk">${num(rank) ? ord(Number(rank)) : ""}</span>
    </div>`;
}
function statBlock(title, rows, g, offTeam) {
  const offAway = offTeam === g.away;
  const head = `<div class="h2h-head"><div style="color:${g.ca.ink}">${esc(g.away)} ${offAway ? "Off" : "Def"}</div><div class="c">Nat'l rank</div><div class="r" style="color:${g.ch.ink}">${esc(g.home)} ${offAway ? "Def" : "Off"}</div></div>`;
  const body = rows.map(r => {
    const noLead = !r.leader, aw = r.leader === g.away;
    return `<div class="srow">
      ${side("l", r.away_val, r.away_rank, g.ca.ink, noLead || aw, r.fmt)}
      <div class="cat">${esc(r.label)}</div>
      ${side("r", r.home_val, r.home_rank, g.ch.ink, noLead || !aw, r.fmt)}
    </div>`;
  }).join("");
  return `<div class="sec">${esc(title)}<small>${g.stats_preseason ? "Preseason profile" : "This season"}</small></div><div class="card">${head}${body}</div>`;
}

function cmpTile(r, g) {
  const aLead = r.away_leads, hLead = r.home_leads, none = !aLead && !hLead;
  let split = "";
  if (num(r.away_val) && num(r.home_val) && (Number(r.away_val) + Number(r.home_val)) > 0) {
    const a = Number(r.away_val), h = Number(r.home_val), pa = 100 * a / (a + h);
    split = `<div class="split"><i style="width:${pa}%; background:${g.ca.ink}"></i><i style="flex:1; background:${g.ch.ink}"></i></div>`;
  }
  return `<div class="cmp"><div class="lbl">${esc(r.label)}</div>
    <div class="pair"><span class="v ${none || aLead ? "" : "dim"}" style="color:${g.ca.ink}">${fmtVal(r.away_val, r.fmt)}</span><span class="v ${none || hLead ? "" : "dim"}" style="color:${g.ch.ink}">${fmtVal(r.home_val, r.fmt)}</span></div>
    <div class="who"><span>${esc(g.away)}</span><span>${esc(g.home)}</span></div>${split}</div>`;
}

function renderBet(g) {
  const p = g.play;
  if (!p || !p.has_play || p.is_pass) return `<div class="card nobet">No bet on this game.</div>`;
  const res = p.result ? `<span class="res ${p.result.toLowerCase()}">${esc(p.result)}</span>` : "";
  const why = (g.reasons || []).map(r => `<div class="reason ${r.kind}"><span class="chip">${r.kind === "caution" ? "RISK" : "WHY"}</span><span>${esc(r.text)}</span></div>`).join("");
  return `<div class="card bet">
    <div class="bet-head"><span class="lbl">THE BET</span><span style="display:flex; gap:8px; align-items:center">${res}${p.units ? `<span class="units">${esc(String(p.units))}u</span>` : ""}</span></div>
    <div class="card-pad">
      <div class="bet-pick" style="color:${p.color || "var(--ink)"}">${esc(p.side_text)}</div>
      ${p.detail ? `<div class="bet-detail">${esc(p.detail)}</div>` : ""}
      ${p.locked ? `<div class="bet-detail">At bet time: our line <b>${esc(p.locked.our)}</b> · bet at <b>${esc(p.locked.mkt)}</b> · our total <b>${esc(p.locked.our_total)}</b>${p.locked.mkt_total !== "-" ? ` vs ${esc(p.locked.mkt_total)}` : ""}</div>` : ""}
      ${why ? `<div class="reasons">${why}</div>` : ""}
    </div></div>`;
}

function renderBooks(g) {
  if (!g.books || !g.books.length) return "";
  const rows = g.books.map(b => `<tr><td>${esc(b.book)}</td><td class="${b.best_spread ? "best" : ""}">${sgn(b.spread)}</td><td>${sgn(b.spread_open)}</td>
      <td>${num(b.total) ? Number(b.total).toFixed(1) : "-"}</td><td>${num(b.total_open) ? Number(b.total_open).toFixed(1) : "-"}</td><td>${ml(b.away_ml)}</td><td>${ml(b.home_ml)}</td></tr>`).join("");
  return `<div class="sec">Lines by Book</div><div class="card"><div class="books-scroll"><table class="books"><thead><tr><th>Book</th><th>${esc(g.home)}</th><th>Open</th><th>Total</th><th>Open</th><th>${esc(g.away)} ML</th><th>${esc(g.home)} ML</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${g.best_text ? `<div class="best-line">${g.best_text}</div>` : ""}</div>`;
}



function styleCard(rows, g) {
  const body = rows.map(r => {
    const a = fmtVal(r.away_val, r.fmt), h = fmtVal(r.home_val, r.fmt);
    return `<div class="xrow"><span class="sv ${r.away_leads ? "lead" : ""}" style="${r.away_leads ? `color:${g.ca.ink}` : ""}">${a}</span><span class="sl">${esc(r.label)}</span><span class="sv r ${r.home_leads ? "lead" : ""}" style="${r.home_leads ? `color:${g.ch.ink}` : ""}">${h}</span></div>`;
  }).join("");
  return `<div class="card stylecard"><div class="xrow shead"><span style="color:${g.ca.ink}">${esc(g.away)}</span><span></span><span class="r" style="color:${g.ch.ink}">${esc(g.home)}</span></div>${body}</div>`;
}
function playerTable(team, rows, ink) {
  if (!rows || !rows.length) return "";
  const body = rows.map(p => `<tr><td class="pn"><b>${esc(p.name)}</b><span>${esc([p.pos, p.ht].filter(Boolean).join(" · "))}${p.starter ? " · Starter" : ""}</span></td>
    <td>${p.mpg}</td><td><b>${p.ppg}</b></td><td>${p.rpg}</td><td>${p.apg}</td><td>${esc(p.three)}</td><td>${esc(p.ft)}</td><td>${p.pf}</td></tr>`).join("");
  return `<div class="card ptab"><div class="pt-head" style="color:${ink}; border-color:${ink}">${esc(team)}</div>
    <div class="pt-scroll"><table><thead><tr><th>Player</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>3PT</th><th>FT%</th><th>FOULS</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="pt-foot">Per-game averages this season · 3PT is made-attempted, total</div></div>`;
}
function renderGame(g) {
  const md = g.model || {};
  const mk = marketText(g);
  const m = g.market || {};
  const poll = t => t ? `<span class="poll">${esc(t)}</span>` : "";
  const meta = (rec, rank, pts) => `${rec ? `<b>${esc(rec)}</b> last season` : ""}${rank ? ` · Our rank <b>${esc(rank)}</b>` : ""}${num(pts) ? ` · Proj <b>${Math.round(pts)}</b>` : ""}`;
  const awp = num(md.away_wp) ? Math.round(md.away_wp * 100) : null;

  let edge;
  if (md.has_gap) {
    const tg = num(md.total_gap) ? Number(md.total_gap) : null;
    const hot = md.spread_gap >= 3 || (tg !== null && Math.abs(tg) >= 4);
    edge = `<div class="edge ${hot ? "" : "quiet"}"><span class="lbl">${hot ? "Edge" : "vs Market"}</span>
      <span><b>${md.spread_gap.toFixed(1)} pts</b> toward ${esc(md.gap_side)}</span>
      ${tg !== null ? `<span>·</span><span>Total <b>${tg > 0 ? "+" : ""}${tg.toFixed(1)}</b> ${tg > 0 ? "over" : "under"} the market</span>` : ""}</div>`;
  } else {
    edge = `<div class="edge quiet"><span class="lbl">Market</span><span>Not posted yet. Books usually hang a number a day or two before tip.</span></div>`;
  }

  const finalBar = g.final ? `<div class="final"><span class="lbl">FINAL</span><span>${esc(g.final.text)}</span>${g.final.ats ? `<span>${esc(g.final.ats)}</span>` : ""}${g.final.ou ? `<span>${esc(g.final.ou)}</span>` : ""}</div>` : "";
  const totalTxt = num(m.total) ? Number(m.total).toFixed(1) : "-";

  let stats = "";
  if (g.stats_ready) {
    stats = statBlock(`${g.away} Offense vs ${g.home} Defense`, g.stat_rows_away_offense, g, g.away)
          + statBlock(`${g.home} Offense vs ${g.away} Defense`, g.stat_rows_home_offense, g, g.home);
    stats += `<div class="card"><div class="tally" style="border-top:0"><span>${esc(g.tally.away_text)}</span><span>${esc(g.tally.home_text)}</span></div>${g.pace_text ? `<div class="tally">${esc(g.pace_text)}</div>` : ""}</div>`;
  }

    ${g.continuity && g.continuity.length ? `<div class="sec">Roster Continuity</div><div class="cmp-grid">${g.continuity.map(r => cmpTile(r, g)).join("")}</div>` : ""}
    ${g.form_rows && g.form_rows.length ? `<div class="sec">This Season So Far</div><div class="cmp-grid">${g.form_rows.map(r => cmpTile(r, g)).join("")}</div>` : ""}

}

function init(data) {
  document.getElementById("week-label").textContent = `College Basketball · ${data.week_label || ""}`;
  const games = data.games;
  const gamesEl = document.getElementById("games"), dayEl = document.getElementById("daybar"), barEl = document.getElementById("gamebar"), board = document.getElementById("board");
  games.forEach((g, i) => { g._id = `g${i}`; gamesEl.insertAdjacentHTML("beforeend", renderGame(g)); });

  const plays = games.filter(g => g.play && g.play.has_play && !g.play.is_pass);
  const byDay = {}; games.forEach(g => (byDay[g.day_label] = byDay[g.day_label] || []).push(g));
  const BETS = "__BETS__"; byDay[BETS] = plays;

  // bets board
  const neutralN = games.filter(g => g.neutral).length, linesN = games.filter(g => g.market && g.market.has_line).length;
  board.innerHTML = `<div class="board-head"><img src="${data.stamp}" alt=""><div><h1>This Week's Bets</h1><div class="sub">${esc(data.week_label)} · ${games.length} games on the board</div></div></div>
    <div class="kpis"><div class="kpi"><b>${plays.length}</b><span>Bets</span></div><div class="kpi"><b>${games.length}</b><span>Games</span></div><div class="kpi"><b>${linesN}</b><span>Lines posted</span></div><div class="kpi"><b>${neutralN}</b><span>Neutral sites</span></div></div>
    <div class="betcards">${plays.map(g => `<button class="betcard" data-game="${g._id}" style="--c:${g.play.color || "var(--navy)"}">
        <div class="bc-top"><span class="bc-day">${esc(g.day_label)}${g.tip_label ? " · " + esc(g.tip_label) : ""}</span>${g.play.result ? `<span class="res ${g.play.result.toLowerCase()}">${esc(g.play.result)}</span>` : (g.play.units ? `<span class="bc-day" style="color:var(--orange-deep)">${esc(String(g.play.units))}u</span>` : "")}</div>
        <div class="bc-pick">${esc(g.play.side_text)}</div>
        <div class="bc-match"><span style="color:${g.ca.ink}; font-weight:700">${esc(g.away)}</span> ${g.neutral ? "vs" : "at"} <span style="color:${g.ch.ink}; font-weight:700">${esc(g.home)}</span>${g.neutral ? " · Neutral" : ""}</div>
        ${g.play.locked ? `<div class="bc-nums"><span>Our line <b>${esc(g.play.locked.our)}</b></span><span>Bet at <b>${esc(g.play.locked.mkt)}</b></span><span>Our total <b>${esc(g.play.locked.our_total)}</b>${g.play.locked.mkt_total !== "-" ? ` vs <b>${esc(g.play.locked.mkt_total)}</b>` : ""}</span></div>`
          : `<div class="bc-nums"><span>Our line <b>${esc(g.model.line)}</b></span><span>Market <b>${esc(marketText(g) || "-")}</b></span><span>Total <b>${esc(g.model.total)}</b></span></div>`}
      </button>`).join("")}</div>`;
  board.querySelectorAll(".betcard").forEach(b => b.addEventListener("click", () => showGame(b.dataset.game)));

  function showGame(id) {
    board.classList.remove("show");
    barEl.querySelectorAll(".gamechip").forEach(t => t.classList.toggle("active", t.dataset.game === id));
    document.querySelectorAll(".game").forEach(el => el.classList.toggle("active", el.id === id));
    const chip = barEl.querySelector(`[data-game="${id}"]`); if (chip) chip.scrollIntoView({block: "nearest", inline: "center"});
    window.scrollTo({top: 0, behavior: "smooth"});
  }
  function showDay(name) {
    dayEl.querySelectorAll(".daytab").forEach(t => t.classList.toggle("active", t.dataset.day === name));
    barEl.innerHTML = byDay[name].map(g => `<button class="gamechip" data-game="${g._id}">${g.play && g.play.has_play ? `<span class="star">★</span>` : ""}<span class="dot" style="background:${g.ca.ink}"></span>${esc(g.away)}<span class="vs">${g.neutral ? "vs" : "@"}</span><span class="dot" style="background:${g.ch.ink}"></span>${esc(g.home)}</button>`).join("");
    barEl.querySelectorAll(".gamechip").forEach(c => c.addEventListener("click", () => showGame(c.dataset.game)));
    if (name === BETS) {
      document.querySelectorAll(".game").forEach(el => el.classList.remove("active"));
      board.classList.add("show"); window.scrollTo({top: 0});
    } else showGame(byDay[name][0]._id);
  }
  const mk = (day, label, cls) => { const b = document.createElement("button"); b.className = "daytab " + (cls || ""); b.dataset.day = day; b.textContent = label; b.addEventListener("click", () => showDay(day)); dayEl.appendChild(b); };
  if (plays.length) mk(BETS, `★ Bets (${plays.length})`, "bets");
  Object.keys(byDay).filter(k => k !== BETS).forEach(d => mk(d, `${d} (${byDay[d].length})`));
  showDay(plays.length ? BETS : Object.keys(byDay).find(k => k !== BETS));


  // ---------- search ----------
  const CONF = {A10:"Atlantic 10",ACC:"ACC",AE:"America East",ASun:"ASUN",Amer:"American",B10:"Big Ten",B12:"Big 12",BE:"Big East",BSky:"Big Sky",BSth:"Big South",BW:"Big West",CAA:"Coastal Athletic CAA",CUSA:"Conference USA CUSA",Horz:"Horizon League",Ivy:"Ivy League",MAC:"Mid-American MAC",MC:"MAAC Metro Atlantic",MEAC:"MEAC",MVC:"Missouri Valley MVC",MWC:"Mountain West MWC",NEC:"Northeast NEC",OVC:"Ohio Valley OVC",P12:"Pac-12 Pac 12",PL:"Patriot League",SB:"Sun Belt",SC:"Southern SoCon",SEC:"SEC",SWAC:"SWAC",Slnd:"Southland",Sum:"Summit League",UAC:"United Athletic UAC",WCC:"West Coast WCC"};
  const CONF_SHORT = {A10:"A-10",AE:"America East",ASun:"ASUN",Amer:"American",B10:"Big Ten",B12:"Big 12",BE:"Big East",BSky:"Big Sky",BSth:"Big South",BW:"Big West",CUSA:"C-USA",Horz:"Horizon",Ivy:"Ivy",MC:"MAAC",MVC:"Valley",MWC:"Mountain West",NEC:"NEC",OVC:"OVC",P12:"Pac-12",PL:"Patriot",SB:"Sun Belt",SC:"SoCon",Slnd:"Southland",Sum:"Summit",UAC:"UAC"};
  const TEAMS = data.teams || {};
  const norm = t => " " + (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/&/g, " and ").replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, " ")
    .replace(/\bstate\b/g, "st").replace(/\bsaint\b/g, "st").replace(/\buniversity\b/g, "").replace(/\s+/g, " ").trim() + " ";
  const teamHay = n => { const t = TEAMS[n] || {}; return [n, t.mascot, t.abbr, t.short, t.kp, t.conf, CONF[t.conf], CONF_SHORT[t.conf]].join(" | "); };
  const confOf = n => { const c = (TEAMS[n] || {}).conf; return c ? (CONF_SHORT[c] || c) : ""; };
  games.forEach(g => { g._hay = norm(teamHay(g.away) + " | " + teamHay(g.home) + " | " + g.day_label); g._ta = norm(teamHay(g.away)); g._th = norm(teamHay(g.home)); });
  const qEl = document.getElementById("q"), sBox = document.getElementById("search"), resEl = document.getElementById("results"), resIn = document.getElementById("results-in");
  let hits = [], sel = -1;
  const placeResults = () => { resEl.style.top = document.querySelector(".topbar").getBoundingClientRect().bottom + "px"; };
  function rowSide(g) {
    if (g.final) return `<div>${esc(g.final.text)}</div>`;
    const m = marketText(g); return `${m ? `<div>${esc(m)}</div>` : ""}${g.model ? `<div>Ours <b>${esc(g.model.line)}</b></div>` : ""}`;
  }
  function runSearch() {
    const raw = qEl.value; sBox.classList.toggle("has-q", !!raw);
    const words = norm(raw).trim().split(" ").filter(Boolean);
    if (!words.length) { closeResults(); return; }
    const phrase = " " + words.join(" ");
    // one team has to match the whole search (so "big 12" means the Big 12, not Big East + Pac-12)
    hits = games.filter(g => g._ta.includes(phrase) || g._th.includes(phrase));
    if (!hits.length) hits = games.filter(g => words.every(w => g._hay.includes(" " + w)));
    const nm = n => norm(n).trim(), qn = words.join(" ");
    const exact = g => (nm(g.away) === qn || nm(g.home) === qn || norm((TEAMS[g.away] || {}).mascot).trim() === qn || norm((TEAMS[g.home] || {}).mascot).trim() === qn) ? 0 : 1;
    const exactIds = new Set(hits.filter(g => !exact(g)).map(g => g._id));
    sel = hits.length ? 0 : -1;
    let html = `<div class="r-head">${hits.length} game${hits.length === 1 ? "" : "s"} this week</div>`;
    if (!hits.length) html += `<div class="r-empty">No games match "${esc(raw)}". Try a school, a mascot like "Jayhawks", or a conference like "Big 12".</div>`;
    let lastDay = null;
    const ordered = hits.slice(0, 80).sort((a, b) => (exactIds.has(b._id) - exactIds.has(a._id)) || games.indexOf(a) - games.indexOf(b));
    ordered.forEach(g => {
      const top = exactIds.has(g._id) && exactIds.size < ordered.length;
      const hdr = top ? "Top match" : g.day_label;
      if (hdr !== lastDay) { html += `<div class="r-day">${esc(hdr)}</div>`; lastDay = hdr; }
      const bet = g.play && g.play.has_play && !g.play.is_pass;
      const confs = [...new Set([confOf(g.away), confOf(g.home)].filter(Boolean))].join(" vs ");
      html += `<button class="r-item" data-game="${g._id}">
        <div class="r-main"><div class="r-teams">${bet ? `<span class="r-star">★</span>` : ""}<span class="dot" style="background:${g.ca.ink}"></span>${esc(g.away)}<span class="vs">${g.neutral ? "vs" : "@"}</span><span class="dot" style="background:${g.ch.ink}"></span>${esc(g.home)}</div>
        <div class="r-meta">${top ? `<b>${esc(g.day_label)}</b> · ` : ""}${g.tip_label ? `<b>${esc(g.tip_label)}</b>` : ""}${confs ? ` · ${esc(confs)}` : ""}${g.neutral ? " · Neutral" : ""}${bet ? ` · <b style="color:var(--orange-deep)">Bet: ${esc(g.play.side_text)}</b>` : ""}</div></div>
        <div class="r-side">${bet && g.play.result ? `<span class="res ${g.play.result.toLowerCase()}">${esc(g.play.result)}</span>` : rowSide(g)}</div></button>`;
    });
    resIn.innerHTML = html; placeResults(); resEl.classList.add("open"); resIn.scrollTop = 0;
    const items = [...resIn.querySelectorAll(".r-item")];
    items.forEach(b => b.addEventListener("click", () => pick(b.dataset.game)));
    hits = items.map(b => b.dataset.game); markSel();
  }
  function markSel() { resIn.querySelectorAll(".r-item").forEach((b, i) => b.classList.toggle("sel", i === sel)); }
  function closeResults() { resEl.classList.remove("open"); hits = []; sel = -1; }
  function pick(id) {
    const g = games.find(x => x._id === id); if (!g) return;
    showDay(g.day_label); showGame(id);
    qEl.value = ""; sBox.classList.remove("has-q"); closeResults(); qEl.blur();
    const el = document.getElementById(id); if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
  qEl.addEventListener("input", runSearch);
  qEl.addEventListener("focus", () => { if (qEl.value) runSearch(); });
  qEl.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" && hits.length) { sel = Math.min(sel + 1, hits.length - 1); markSel(); e.preventDefault(); }
    else if (e.key === "ArrowUp" && hits.length) { sel = Math.max(sel - 1, 0); markSel(); e.preventDefault(); }
    else if (e.key === "Enter") { if (sel >= 0 && hits[sel]) pick(hits[sel]); e.preventDefault(); }
    else if (e.key === "Escape") { qEl.value = ""; sBox.classList.remove("has-q"); closeResults(); qEl.blur(); }
  });
  document.getElementById("q-clear").addEventListener("click", () => { qEl.value = ""; sBox.classList.remove("has-q"); closeResults(); qEl.focus(); });
  document.addEventListener("click", e => { if (!resEl.contains(e.target) && !sBox.contains(e.target)) closeResults(); });
  document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== qEl) { qEl.focus(); e.preventDefault(); } });
  window.addEventListener("resize", placeResults);

  const fit = () => { document.querySelector(".gamebar-wrap").style.top = document.querySelector(".topbar").offsetHeight + "px"; };
  fit(); window.addEventListener("resize", fit);
}
